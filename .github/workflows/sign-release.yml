name: Sign verified Android release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful run ID from Android engine and mobile shell'
        type: string
        required: true
      expected_source_sha:
        description: 'Optional full commit SHA associated with the build run'
        type: string
        required: false

permissions:
  actions: read
  contents: read

jobs:
  sign:
    if: >-
      github.repository == 'by-jsk/stellarium-android' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stellar-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify successful build and download its exact ARM64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          python3 tools/fetch-signing-input.py "$BUILD_RUN_ID" "$EXPECTED_SOURCE_SHA" "$RUNNER_TEMP/stellar-input"
      - name: Prepare Android signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Sign with the existing Stellar Touch release certificate
        env:
          STELLAR_KEYSTORE_B64: ${{ secrets.STELLAR_KEYSTORE_B64 }}
          STELLAR_SIGN_PASSWORD: ${{ secrets.STELLAR_SIGN_PASSWORD }}
        run: |
          bash tools/sign-apk.sh "$ANDROID_HOME/build-tools/36.0.0" \
            "$RUNNER_TEMP/stellar-input/StellarTouch-arm64-v8a-unsigned.apk" \
            "$RUNNER_TEMP/stellar-signed"
      - name: Add the verified build provenance to the signing report
        run: cp "$RUNNER_TEMP/stellar-input/build-provenance.json" "$RUNNER_TEMP/stellar-signed/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stellar-touch-signed-arm64
          path: |
            ${{ runner.temp }}/stellar-signed/StellarTouch-v*.apk
            ${{ runner.temp }}/stellar-signed/StellarTouch-v*.apk.signer.txt
            ${{ runner.temp }}/stellar-signed/StellarTouch-v*.apk.badging.txt
            ${{ runner.temp }}/stellar-signed/SHA256SUMS.txt
            ${{ runner.temp }}/stellar-signed/build-provenance.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
