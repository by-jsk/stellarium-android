name: Android engine and mobile shell
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: android_arm64_v8a
            abi: arm64-v8a
          - arch: android_x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache gettext libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: ${{ matrix.arch }}
          modules: 'qtcharts qtpositioning qtserialport qtmultimedia qtimageformats qtspeech'
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: android-ccache-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: android-ccache-${{ matrix.abi }}-
      - name: Prepare pinned PC engine
        run: |
          python3 tools/check-source.py
          python3 tools/prepare.py --fetch
      - name: Build Android APK with bundled PC data
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          export QT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          bash tools/build-android.sh 2>&1 | tee build.log
          test -s "release/StellarTouch-${ANDROID_ABI}-unsigned.apk"
      - name: Package corresponding source
        if: matrix.abi == 'arm64-v8a'
        run: python3 tools/package-source.py
      - name: Enable emulator acceleration
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sign emulator fixture with a temporary test key
        if: matrix.abi == 'x86_64'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-test.jks" -storepass android -keypass android -alias test -keyalg RSA -validity 30 -dname 'CN=Ephemeral emulator test'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator-test.jks" --ks-pass pass:android --out release/StellarTouch-x86_64-test.apk release/StellarTouch-x86_64-unsigned.apk
          python3 -m pip install pillow
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.abi == 'x86_64'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python3 tools/smoke-android.py release/StellarTouch-x86_64-test.apk
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.abi }}
          path: |
            build.log
            build-*/CMakeCache.txt
          if-no-files-found: warn
          compression-level: 0
      - name: Upload unsigned APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: release/StellarTouch-${{ matrix.abi }}-unsigned.apk
          compression-level: 0
      - name: Upload execution report and screen previews
        if: always() && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-preview
          path: release/smoke/
          if-no-files-found: ignore
      - name: Upload corresponding source part 1
        if: success() && matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: corresponding-source-part-00
          path: release/source-parts/*.part-00
          compression-level: 0
      - name: Upload corresponding source part 2
        if: success() && matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: corresponding-source-part-01
          path: release/source-parts/*.part-01
          if-no-files-found: ignore
          compression-level: 0
      - name: Save compiler cache even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: android-ccache-${{ matrix.abi }}-${{ github.run_id }}
